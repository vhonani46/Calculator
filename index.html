
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Support responsive layouts on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Calculator</title>

    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="style.css">

    <!-- Load JavaScript after the HTML has been parsed -->
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Main calculator container -->
    <main class="calculator">

        <h2>Calculator</h2>

        <!-- Display for the current expression and result -->
        <input
            type="text"
            id="display"
            class="display"
            value="0"
            aria-label="Calculator display"
            readonly
        >

        <!-- Grid containing all calculator buttons -->
        <div class="buttons">

            <button class="clear" data-action="clear">AC</button>
            <button data-action="delete">DEL</button>
            <button class="operator" data-action="percent">%</button>
            <button class="operator" data-value="/" aria-label="Divide">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*" aria-label="Multiply">X</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button class="zero" data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equals" data-action="calculate">=</button>

        </div>
    </main>

</body>
</html>
